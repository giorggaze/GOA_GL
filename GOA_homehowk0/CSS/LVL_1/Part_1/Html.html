<!-- შექმენი მარტივი HTML გვერდი, სადაც გამოიყენებ inline style.

მოთხოვნები:
 
დაამატე:
h1 — „ჩემი ვებგვერდი“,
h2 — „ჩემ შესახებ“,
,

 
h1-ს მიანიჭე:
color
font-size,
,
,

  
h2-ს მიანიჭე:
color
font-family,
,
,

დაამატე ერთი p ტექსტი:
     
გამოიყენე b, i, u
   
ტექსტს მიეცი background-color,

,

ყველა სტილი იყოს inline -->

<!DOCTYPE html>
<html lang="en">
<head >
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black;">
    <header>
        <h1 style="color: red; font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;">helooo</h1>
        <h2 style="color: yellow;">ჩემს შესახებ</h2>
    </header>


    <main>
        <p style="color:blueviolet; font-size: 50px;">giorgi</p>
        <p style="color:blueviolet; font-size: 50px;">giorgi</p>
        <p style="color:blueviolet; font-size: 50px;">giorgi</p>
        <button style="background:rgb(166, 0, 255); font-size: 70px;; border-radius: 100000000pt;">giorgi</button>
        <button style="background:rgb(166, 0, 255); font-size: 70px;">giorgi</button>
    </main>



</body>
</html>
